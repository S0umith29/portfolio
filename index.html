<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soumith | Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="terminal">
        <div id="output">
            <p>Last login: Wed Apr  1 09:24:36 on ttys000</p>
            <p>Type 'help' to see a list of available commands.</p>
        </div>
        <div id="input-line">
            <span class="prompt">viewer@sowmith ~ %</span>
            <span id="cmd-text"></span><span id="cursor"></span>
            <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
